# 앱의 「골프장 정보 요청」(data/course-requests.json에 status "요청")이 올라오면
# tools/course_fetch.py가 Claude로 골프장 홈페이지를 읽어 data/courses.json·홀 그림을 등록하고 결과를 커밋한다.
# 필요: 저장소 Settings → Secrets and variables → Actions → New repository secret 「ANTHROPIC_API_KEY」
name: 골프장 정보 등록

on:
  push:
    branches: [main]
    paths: [data/course-requests.json]
  workflow_dispatch:

permissions:
  contents: write

# 요청이 연달아 와도 한 번에 하나씩(같은 파일을 동시에 고치지 않게)
concurrency:
  group: course-request
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "anthropic>=2.3" requests pillow
      - name: 요청 처리
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/course_fetch.py
      - name: 결과 커밋
        run: |
          git config user.name "golf-lounge-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/course-requests.json data/courses.json data/courses
          git diff --cached --quiet && exit 0
          git commit -q -m "골프장 정보 자동 등록"
          # 그동안 앱이 라운드를 저장했으면 그 위에 다시 올린다
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
